<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#F8F9FA">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="Mehak Bridal Studio — Luxury Bridal Lehenga Inventory & Studio Booking System">
  <title>Mehak Bridal Studio | Luxury Bridal Atelier</title>
  
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/icon-192.png">
  <link rel="apple-touch-icon" href="/assets/icon-192.png">
  <link rel="stylesheet" href="/css/index.css?v=17">
  <style>
    @keyframes studioPulse {
      0%, 100% { transform: scale(1); opacity: 0.95; }
      50% { transform: scale(1.06); opacity: 1; filter: drop-shadow(0 6px 16px rgba(158, 123, 59, 0.25)); }
    }
    @keyframes studioSpin {
      to { transform: rotate(360deg); }
    }
  </style>
  <script>
    // Failsafe error display for mobile phones
    window.addEventListener('error', function(e) {
      var root = document.getElementById('app-root');
      if (root && (!root.children.length || document.getElementById('initial-preloader'))) {
        root.innerHTML = '<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;font-family:-apple-system,sans-serif;background:#FFFDF9;"><img src="/assets/logo.png" alt="Mehak Bridal Studio" style="width:110px;height:auto;margin-bottom:12px;" /><h3 style="color:#4A0E17;font-size:17px;margin:0 0 8px;">Mehak Bridal Studio</h3><p style="font-size:13px;color:#666;max-width:320px;margin-bottom:18px;">Unable to load studio view. Tap reload to refresh.</p><button onclick="location.reload(true)" style="padding:10px 24px;background:#9E7B3B;color:#fff;border:none;border-radius:8px;font-weight:600;font-size:14px;cursor:pointer;">Reload Studio</button></div>';
      }
    });
  </script>
</head>
<body>
  <div id="app-root">
    <!-- Immediate Mobile & Desktop Preloader (eliminates blank white screens) -->
    <div id="initial-preloader" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #FFFDF9; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #4A0E17;">
      <div style="width: 88px; height: 88px; border-radius: 16px; background: #FFFFFF; border: 1.5px solid #EEDFC6; display: flex; align-items: center; justify-content: center; margin-bottom: 16px; padding: 6px; box-shadow: 0 4px 18px rgba(158, 123, 59, 0.15); animation: studioPulse 1.8s ease-in-out infinite;">
        <img src="/assets/logo.png" alt="Mehak Bridal Studio" style="width: 100%; height: 100%; object-fit: contain;" />
      </div>
      <div style="width: 28px; height: 28px; border: 2.5px solid #EEDFC6; border-top-color: #9E7B3B; border-radius: 50%; animation: studioSpin 0.75s linear infinite;"></div>
      <div style="margin-top: 14px; font-weight: 600; font-size: 13px; letter-spacing: 0.05em; text-transform: uppercase; color: #8C6A2A;">Loading Bridal Studio...</div>
    </div>
  </div>
  <script type="module" src="/js/app.js?v=2.2.7"></script>
</body>
</html>
