<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#F8F9FA">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="Mehak Bridal Studio — Luxury Bridal Lehenga Inventory & Studio Booking System">
  <title>Mehak Bridal Studio | Luxury Bridal Atelier</title>
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%2396743A%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22><path d=%22M2 4l3 12h14l3-12-6 7-4-7-4 7-6-7zm3 16h14%22/></svg>">
  <link rel="stylesheet" href="/css/index.css?v=5">
  <style>
    @keyframes studioPulse {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.08); opacity: 1; }
    }
    @keyframes studioSpin {
      to { transform: rotate(360deg); }
    }
  </style>
  <script>
    // Failsafe error display for mobile phones
    window.addEventListener('error', function(e) {
      var root = document.getElementById('app-root');
      if (root && (!root.children.length || document.getElementById('initial-preloader'))) {
        root.innerHTML = '<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;font-family:-apple-system,sans-serif;background:#FFFDF9;"><div style="font-size:38px;margin-bottom:12px;">👗</div><h3 style="color:#4A0E17;font-size:17px;margin:0 0 8px;">Mehak Bridal Studio</h3><p style="font-size:13px;color:#666;max-width:320px;margin-bottom:18px;">Unable to load studio view. Tap reload to refresh.</p><button onclick="location.reload(true)" style="padding:10px 24px;background:#9E7B3B;color:#fff;border:none;border-radius:8px;font-weight:600;font-size:14px;cursor:pointer;">Reload Studio</button></div>';
      }
    });
  </script>
</head>
<body>
  <div id="app-root">
    <!-- Immediate Mobile & Desktop Preloader (eliminates blank white screens) -->
    <div id="initial-preloader" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #FFFDF9; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #4A0E17;">
      <div style="width: 54px; height: 54px; border-radius: 50%; background: #FAF3E7; border: 1.5px solid #EEDFC6; display: flex; align-items: center; justify-content: center; margin-bottom: 16px; animation: studioPulse 1.8s ease-in-out infinite;">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#9E7B3B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4l3 12h14l3-12-6 7-4-7-4 7-6-7zm3 16h14"/></svg>
      </div>
      <div style="width: 32px; height: 32px; border: 2.5px solid #EEDFC6; border-top-color: #9E7B3B; border-radius: 50%; animation: studioSpin 0.75s linear infinite;"></div>
      <div style="margin-top: 14px; font-weight: 600; font-size: 14px; letter-spacing: 0.03em; color: #8C6A2A;">Loading Bridal Studio...</div>
    </div>
  </div>
  <script type="module" src="/js/app.js?v=5"></script>
</body>
</html>
