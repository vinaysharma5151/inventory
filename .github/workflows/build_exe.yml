name: Build Windows Executable

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller

      - name: Build Standalone Executable with PyInstaller
        run: |
          python -m PyInstaller --noconfirm LehengaBooking.spec

      - name: Upload LehengaBooking.exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LehengaBooking-Windows-EXE
          path: dist/LehengaBooking.exe
          if-no-files-found: error

      - name: Release to Main Repository Releases (if Tagged)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/LehengaBooking.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release to Public Releases Repo (if RELEASE_PAT is configured)
        if: startsWith(github.ref, 'refs/tags/v') && env.RELEASE_PAT != ''
        uses: softprops/action-gh-release@v2
        with:
          repository: vinaysharma5151/rental_releases
          files: dist/LehengaBooking.exe
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}

